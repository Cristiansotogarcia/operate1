<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80" fill="none">
  <defs>
    <linearGradient id="oGrad" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="oneGrad" x1="55" y1="0" x2="90" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- O -->
  <circle cx="32" cy="40" r="26" stroke="url(#oGrad)" stroke-width="8" fill="none"/>
  <!-- 1 -->
  <rect x="62" y="14" width="10" height="52" rx="3" fill="url(#oneGrad)"/>
  <!-- Signal bars on the 1 -->
  <rect x="78" y="10" width="5" height="14" rx="2" fill="url(#barGrad)"/>
  <rect x="86" y="6" width="5" height="12" rx="2" fill="url(#barGrad)" opacity="0.85"/>
  <rect x="94" y="3" width="5" height="10" rx="2" fill="url(#barGrad)" opacity="0.7"/>
  <!-- "operate1" text -->
  <text x="110" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="28" font-weight="700" fill="url(#textGrad)" letter-spacing="1">operate1</text>
</svg>
